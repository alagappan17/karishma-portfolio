media:
  - name: project-images
    label: Project images
    input: public/media/projects
    output: /media/projects
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe
  - name: lifestyle-images
    label: Lifestyle images
    input: public/media/lifestyle
    output: /media/lifestyle
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe
  - name: personal-images
    label: Personal images
    input: public/media/personal
    output: /media/personal
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe

settings:
  commit:
    templates:
      create: "content(case-study): add {filename}"
      update: "content(case-study): update {filename}"
      delete: "content(case-study): remove {filename}"

content:
  - name: case-studies
    label: Case studies
    type: collection
    path: src/content/projects
    format: json-frontmatter
    operations:
      create: true
      delete: true
      rename: true
    filename:
      template: "{slug}.md"
      field: create
    view:
      primary: title
      fields: [shortTitle, category, featured, order]
      search: [title, shortTitle, category, industry, tags]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: shortTitle
        label: Short title
        type: string
        required: true
        description: Used on project cards and links.
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: Use lowercase letters, numbers, and hyphens only.
        description: Changing this changes the case-study URL.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first and control the Next project link.
      - name: featured
        label: Show on home page
        type: boolean
        description: Turn on to show this case study in the selected-work section on the home page. Only the first six featured projects appear, based on Home page order.
      - name: homeOrder
        label: Home page order
        type: number
        description: Optional. Lower numbers appear first on the home page. Use only when this project is shown there.
      - name: category
        label: Focus / category
        type: string
        required: true
      - name: industry
        label: Industry
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: duration
        label: Timeframe
        type: string
      - name: platform
        label: Platform
        type: string
        required: true
      - name: summary
        label: Card and case-study summary
        type: text
        required: true
      - name: tools
        label: Tools
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
        required: true
      - name: theme
        label: Colour theme
        type: select
        required: true
        options:
          values:
            - name: blue
              label: Blue
            - name: butter
              label: Butter
            - name: ink
              label: Ink
            - name: lilac
              label: Lilac
            - name: paper
              label: Paper
      - name: cover
        label: Cover image
        type: image
        options:
          media: project-images
          path: public/media/projects
          extensions: [png, jpg, jpeg, webp, gif]
          rename: safe
        description: Upload or select the main project image. Leave blank to use the built-in placeholder.
      - name: coverAlt
        label: Cover image description
        type: string
        description: Describe the image for visitors using screen readers.
      - name: coverCaption
        label: Cover image caption
        type: string
      - name: caseImages
        label: Supporting images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: src
            label: Image
            type: image
            required: true
            options:
              media: project-images
              path: public/media/projects
              extensions: [png, jpg, jpeg, webp, gif]
              rename: safe
          - name: alt
            label: Image description
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
      - name: storySections
        label: Case-study sections
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{heading}"
        description: Each item becomes one section on the case-study page. Add, remove, and reorder sections as needed.
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: body
            label: Section content
            type: rich-text
            required: true
            options:
              format: markdown
              media: project-images
              path: public/media/projects
              extensions: [png, jpg, jpeg, webp, gif]
              rename: safe
              switcher: true
  - name: lifestyle
    label: Lifestyle
    type: file
    path: src/data/personalGallery.json
    format: json
    operations:
      delete: false
    fields:
      - name: heading
        label: Section heading
        type: string
        required: true
      - name: intro
        label: Introductory text
        type: text
        required: true
      - name: items
        label: Lifestyle cards
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        description: Add, remove, or reorder the cards shown in Life and curiosities.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: tag
            label: Category label
            type: string
            required: true
          - name: cornerText
            label: Card description
            type: text
            required: true
          - name: image
            label: Image
            type: image
            required: true
            options:
              media: lifestyle-images
              path: public/media/lifestyle
              extensions: [png, jpg, jpeg, webp, gif]
              rename: safe
          - name: imageAlt
            label: Image description
            type: string
            required: true
          - name: tilt
            label: Card tilt
            type: number
            description: A small rotation in degrees, such as -2 or 1.5.
          - name: theme
            label: Accent colour
            type: select
            required: true
            options:
              values:
                - name: acid
                  label: Acid
                - name: peach
                  label: Peach
                - name: blue
                  label: Blue
                - name: lilac
                  label: Lilac
                - name: paper
                  label: Paper
                - name: signal
                  label: Signal
  - name: home-page
    label: Home Page
    type: file
    path: src/data/homePage.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Name
        type: string
        required: true
        description: Shown in the home hero and site header.
      - name: monogram
        label: Header monogram
        type: string
        required: true
        description: The initials shown in the site header.
      - name: role
        label: Professional title
        type: string
        required: true
      - name: profileImage
        label: Hero profile image
        type: image
        required: true
        options:
          media: personal-images
          path: public/media/personal
          extensions: [png, jpg, jpeg, webp, gif]
          rename: safe
      - name: profileImageAlt
        label: Profile image description
        type: string
        required: true
      - name: profileImageLink
        label: Profile image destination link
        type: string
        description: Optional. When set, visitors can open this link by selecting the profile image.
      - name: heading
        label: Hero heading
        type: string
        required: true
      - name: body
        label: Hero description
        type: text
        required: true
      - name: primaryAction
        label: Main hero link
        type: object
        fields:
          - name: label
            label: Link label
            type: string
            required: true
          - name: href
            label: Link destination
            type: string
            required: true
      - name: secondaryAction
        label: Secondary hero link
        type: object
        fields:
          - name: label
            label: Link label
            type: string
            required: true
          - name: href
            label: Link destination
            type: string
            required: true
      - name: introduction
        label: Scroll introduction
        type: object
        fields:
          - name: segments
            label: Text segments
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{text}"
            description: Add segments in reading order. Highlight only the words that should receive an accent colour.
            fields:
              - name: text
                label: Text
                type: text
                required: true
              - name: highlight
                label: Highlight colour
                type: select
                options:
                  values:
                    - name: blue
                      label: Blue
                    - name: lilac
                      label: Lilac
                    - name: acid
                      label: Acid green
      - name: workHeading
        label: Selected-work heading
        type: string
        required: true
      - name: workBody
        label: Selected-work description
        type: text
        required: true
      - name: archiveLabel
        label: Browse-work link label
        type: string
        required: true
      - name: archiveHref
        label: Browse-work destination
        type: string
        required: true
  - name: contact
    label: Contact
    type: file
    path: src/data/contact.json
    format: json
    operations:
      delete: false
    fields:
      - name: heading
        label: Contact heading
        type: string
        required: true
      - name: body
        label: Contact message
        type: text
        required: true
      - name: email
        label: Email address
        type: string
        required: true
      - name: linkedIn
        label: LinkedIn link
        type: string
        required: true
      - name: behance
        label: Behance link
        type: string
        required: true
  - name: navigation
    label: Navigation
    type: file
    path: src/data/navigation.json
    format: json
    operations:
      delete: false
    fields:
      - name: items
        label: Navigation links
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Link label
            type: string
            required: true
          - name: href
            label: Link destination
            type: string
            required: true
      - name: contactLabel
        label: Contact link label
        type: string
        required: true
      - name: contactHref
        label: Contact link destination
        type: string
        required: true
  - name: work-archive
    label: Work Archive
    type: file
    path: src/data/workArchive.json
    format: json
    operations:
      delete: false
    fields:
      - name: heading
        label: Page heading
        type: string
        required: true
      - name: body
        label: Page description
        type: text
        required: true
      - name: supportingText
        label: Supporting text
        type: text
        required: true
      - name: filterLabel
        label: Filter control label
        type: string
        required: true
      - name: allLabel
        label: All-projects filter label
        type: string
        required: true
      - name: controlsBody
        label: Filter helper text
        type: text
        required: true
  - name: case-study-settings
    label: Case Study Page
    type: file
    path: src/data/caseStudySettings.json
    format: json
    operations:
      delete: false
    fields:
      - name: backLabel
        label: Back-link label
        type: string
        required: true
      - name: metadataLabel
        label: Project-details heading
        type: string
        required: true
      - name: imagePlaceholderLabel
        label: Placeholder image label
        type: string
        required: true
      - name: roleLabel
        label: Role field label
        type: string
        required: true
      - name: industryLabel
        label: Industry field label
        type: string
        required: true
      - name: durationLabel
        label: Timeframe field label
        type: string
        required: true
      - name: platformLabel
        label: Platform field label
        type: string
        required: true
      - name: toolsLabel
        label: Tools field label
        type: string
        required: true
  - name: experience
    label: Experience
    type: file
    path: src/data/experience.json
    format: json
    operations:
      delete: false
    fields:
      - name: heading
        label: Section heading
        type: string
        required: true
      - name: body
        label: Introductory text
        type: text
        required: true
      - name: expandLabel
        label: Expand action label
        type: string
        required: true
      - name: collapseLabel
        label: Collapse action label
        type: string
        required: true
      - name: projectLabel
        label: Related work label
        type: string
        required: true
      - name: awardLabel
        label: Recognition label
        type: string
        required: true
      - name: items
        label: Experience entries
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{company} ({period})"
        description: Add, remove, or reorder roles. Expanded details on the website scroll when they exceed the available space.
        fields:
          - name: period
            label: Time period
            type: string
            required: true
          - name: company
            label: Company or chapter
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: duration
            label: Duration
            type: string
            required: true
          - name: highlighted
            label: Highlight this entry
            type: boolean
            description: Adds the subtle accent used for the primary experience entry.
          - name: summary
            label: Summary
            type: text
            required: true
          - name: details
            label: Responsibilities and outcomes
            type: text
            list: true
            required: true
          - name: tags
            label: Skills and focus areas
            type: string
            list: true
            required: true
          - name: awards
            label: Recognition
            type: string
            list: true
          - name: projectSlugs
            label: Related case studies
            type: reference
            options:
              collection: case-studies
              multiple: true
              value: "{slug}"
              label: "{title}"
