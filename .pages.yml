media:
  - name: project-images
    label: Project images
    input: public/media/projects
    output: /media/projects
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe
  - name: lifestyle-images
    label: Lifestyle images
    input: public/media/lifestyle
    output: /media/lifestyle
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe
  - name: personal-images
    label: Personal images
    input: public/media/personal
    output: /media/personal
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe

settings:
  commit:
    templates:
      create: "content(case-study): add {filename}"
      update: "content(case-study): update {filename}"
      delete: "content(case-study): remove {filename}"

content:
  - name: case-studies
    label: Case studies
    type: collection
    path: src/content/projects
    format: json-frontmatter
    operations:
      create: true
      delete: true
      rename: true
    filename:
      template: "{slug}.md"
      field: create
    view:
      primary: title
      fields: [shortTitle, category, featured, order]
      search: [title, shortTitle, category, industry, tags]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: shortTitle
        label: Short title
        type: string
        required: true
        description: Used on project cards and links.
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: Use lowercase letters, numbers, and hyphens only.
        description: Changing this changes the case-study URL.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first and control the Next project link.
      - name: featured
        label: Show on home page
        type: boolean
        description: Turn on to show this case study in the selected-work section on the home page. Only the first six featured projects appear, based on Home page order.
      - name: homeOrder
        label: Home page order
        type: number
        description: Optional. Lower numbers appear first on the home page. Use only when this project is shown there.
      - name: category
        label: Focus / category
        type: string
        required: true
      - name: industry
        label: Industry
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: duration
        label: Timeframe
        type: string
      - name: platform
        label: Platform
        type: string
        required: true
      - name: summary
        label: Card and case-study summary
        type: text
        required: true
      - name: tools
        label: Tools
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
        required: true
      - name: theme
        label: Colour theme
        type: select
        required: true
        options:
          values:
            - name: blue
              label: Blue
            - name: butter
              label: Butter
            - name: ink
              label: Ink
            - name: lilac
              label: Lilac
            - name: paper
              label: Paper
      - name: cover
        label: Cover image
        type: image
        options:
          media: project-images
          path: public/media/projects
          extensions: [png, jpg, jpeg, webp, gif]
          rename: safe
        description: Upload or select the main project image. Leave blank to use the built-in placeholder.
      - name: coverAlt
        label: Cover image description
        type: string
        description: Describe the image for visitors using screen readers.
      - name: coverCaption
        label: Cover image caption
        type: string
      - name: caseImages
        label: Supporting images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: src
            label: Image
            type: image
            required: true
            options:
              media: project-images
              path: public/media/projects
              extensions: [png, jpg, jpeg, webp, gif]
              rename: safe
          - name: alt
            label: Image description
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
      - name: storySections
        label: Case-study sections
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{heading}"
        description: Each item becomes one section on the case-study page. Add, remove, and reorder sections as needed.
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: body
            label: Section content
            type: rich-text
            required: true
            options:
              format: markdown
              media: project-images
              path: public/media/projects
              extensions: [png, jpg, jpeg, webp, gif]
              rename: safe
              switcher: true
  - name: lifestyle
    label: Lifestyle
    type: file
    path: src/data/personalGallery.json
    format: json
    operations:
      delete: false
    fields:
      - name: heading
        label: Section heading
        type: string
        required: true
      - name: intro
        label: Introductory text
        type: text
        required: true
      - name: items
        label: Lifestyle cards
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        description: Add, remove, or reorder the cards shown in Life and curiosities.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: tag
            label: Category label
            type: string
            required: true
          - name: cornerText
            label: Card description
            type: text
            required: true
          - name: image
            label: Image
            type: image
            required: true
            options:
              media: lifestyle-images
              path: public/media/lifestyle
              extensions: [png, jpg, jpeg, webp, gif]
              rename: safe
          - name: imageAlt
            label: Image description
            type: string
            required: true
          - name: tilt
            label: Card tilt
            type: number
            description: A small rotation in degrees, such as -2 or 1.5.
          - name: theme
            label: Accent colour
            type: select
            required: true
            options:
              values:
                - name: acid
                  label: Acid
                - name: peach
                  label: Peach
                - name: blue
                  label: Blue
                - name: lilac
                  label: Lilac
                - name: paper
                  label: Paper
                - name: signal
                  label: Signal
  - name: personal-information
    label: Personal Information
    type: file
    path: src/data/personalInformation.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: monogram
        label: Monogram
        type: string
        required: true
        description: The initials shown in the site header.
      - name: role
        label: Role / professional title
        type: string
        required: true
      - name: profileImage
        label: Profile image
        type: image
        required: true
        options:
          media: personal-images
          path: public/media/personal
          extensions: [png, jpg, jpeg, webp, gif]
          rename: safe
      - name: profileImageAlt
        label: Profile image description
        type: string
        required: true
      - name: profileImageLink
        label: Profile image destination link
        type: string
        description: Optional. When set, visitors can open this link by selecting the profile image.
      - name: contactHeading
        label: Contact heading
        type: string
        required: true
      - name: contactBody
        label: Contact message
        type: text
        required: true
      - name: email
        label: Email address
        type: string
        required: true
      - name: linkedIn
        label: LinkedIn link
        type: string
        required: true
      - name: behance
        label: Behance link
        type: string
        required: true
